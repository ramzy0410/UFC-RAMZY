<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">  <title>Ramzy UFC</title>  
<style>  
*{box-sizing:border-box;font-family:system-ui}  
body{margin:0;padding-bottom:90px;min-height:100vh;  
background: linear-gradient(rgba(255,255,255,0.3), rgba(255,255,255,0.4)), url('bg.jpg');  
background-size:cover;background-position:center top;background-attachment:fixed}  
.header{background:rgba(122,168,255,0.9);backdrop-filter:blur(10px);margin:10px;border-radius:18px;padding:12px;display:flex;justify-content:space-between;align-items:center}  
.lang{background:white;border:0;padding:6px 14px;border-radius:20px;font-weight:800;cursor:pointer}  
.avatar{background:#1e4fd8;color:white;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;border:2px solid white}  
.card{background:rgba(255,255,255,0.88);backdrop-filter:blur(8px);margin:12px;border-radius:18px;padding:14px;box-shadow:0 6px 20px #0002}  
.welcome{background:linear-gradient(135deg,rgba(30,79,216,0.85),rgba(90,140,255,0.75)),url('bg.jpg');background-size:cover;background-position:center;border-radius:18px;padding:20px;color:white;text-align:center;margin:12px}  
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 12px}  
.mod{background:rgba(255,255,255,0.97);border-radius:20px;padding:12px;text-align:center;border:1.5px solid #dbe6ff;cursor:pointer;box-shadow:0 3px 12px #0001;transition:all 0.4s cubic-bezier(.34,1.56,.64,1);min-height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}  
.mod.ico{font-size:24px;transition:0.3s}  
.mod.big{font-size:32px;font-weight:900;color:#1e4fd8;letter-spacing:1px;margin-top:4px;transition:0.3s}  
.mod.full{display:none;opacity:0;transform:translateY(10px);transition:all 0.3s}  
.mod.expanded{transform:scale(1.1);background:white;box-shadow:0 12px 35px #1e4fd84d;border-color:#1e4fd8;z-index:5;min-height:130px}  
.mod.expanded.ico{font-size:28px}  
.mod.expanded.big{font-size:20px}  
.mod.expanded.full{display:block;opacity:1;transform:translateY(0);margin-top:8px}  
.bar{height:6px;background:#dbe6ff;border-radius:10px;width:90%;margin:6px auto 0;overflow:hidden}.bar div{height:100%;background:#1e4fd8}  
.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,0.98);backdrop-filter:blur(12px);display:flex;justify-content:space-around;padding:10px 0;border-radius:20px 20px 0 0;box-shadow:0 -4px 20px #0002}  
.bottom button{border:0;background:none;color:#888;font-size:12px}.bottom button.active{color:#1e4fd8;font-weight:700}  
.page{display:none}.page.active{display:block}  
</style></head><body>  <div class="header"><div><b>Lic1-Eng-Tech</b><br><small>Ramzy • UFC Ghilizane</small></div><div style="display:flex;gap:8px;align-items:center"><button class="lang" onclick="toggleLang()" id="langBtn">العربية</button><div class="avatar" onclick="showPage('profile')">R</div></div></div>  <div id="home" class="page active">  
<div class="welcome"><h2 style="margin:0">جامعة التكوين المتواصل</h2><small>Small steps make big dreams</small></div>  
<div class="card" style="display:flex;justify-content:space-between;align-items:center"><b id="t-progress">Progress 42%</b><div style="width:50px;height:50px;border-radius:50%;border:5px solid #dbe6ff;border-top:5px solid #1e4fd8;display:grid;place-items:center;font-weight:800;color:#1e4fd8">42%</div></div>  
<div class="grid" id="grid"></div>  
<p style="text-align:center;color:#1e4fd8;font-size:11px;margin-top:12px" id="t-hint">👆 المس الحرفين ليظهر الاسم • مرة ثانية للدخول</p>  
</div>  <div id="profile" class="page"><div class="card" style="text-align:center"><img src="ramzy.jpg" style="width:80px;height:80px;border-radius:50%;border:3px solid #1e4fd8"><h3>Ramzy</h3><button onclick="goAdmin()" style="background:#1e4fd8;color:white;padding:12px;width:100%;border-radius:10px;border:0">⚙️ إدارة الدروس</button><button onclick="showPage('home')" style="background:#eee;padding:10px;width:100%;border-radius:10px;border:0;margin-top:8px">🏠 Home</button></div></div>  
<div id="progressPage" class="page"><div class="card"><div id="progressList"></div></div></div>  
<div id="library" class="page"><div class="card"><div id="libraryList"></div></div></div>  <div class="bottom">  
<button class="active" onclick="showPage('home')" id="b-home">🏠<br><span class="bn">Home</span></button>  
<button onclick="showPage('progressPage')" id="b-progress">📊<br><span class="bn">Prog</span></button>  
<button onclick="showPage('library')" id="b-library">📚<br><span class="bn">Lib</span></button>  
<button onclick="showPage('profile')" id="b-profile">👤<br><span class="bn">Prof</span></button>  
</div>  <script>  
let lang=localStorage.getItem('ufc_lang')||'en';  
const i18n={en:{btn:"العربية",hint:"👆 Tap 2 letters to reveal • Tap again to enter",prog:"Progress 42%"},ar:{btn:"English",hint:"👆 المس الحرفين ليظهر الاسم • مرة ثانية للدخول",prog:"التقدم 42%"}};  
const mods=[  
{id:"M01",en:"Comprehension Oral",ar:"فهم شفوي",icon:"🎤",s:"Co",p:60},  
{id:"M02",en:"Written",ar:"تعبير كتابي",icon:"✍️",s:"Wr",p:40},  
{id:"M03",en:"Phonetics",ar:"صوتيات",icon:"🎧",s:"Ph",p:80},  
{id:"M04",en:"Culture",ar:"ثقافة",icon:"🌍",s:"Cu",p:25},  
{id:"M05",en:"Grammar",ar:"قواعد",icon:"📖",s:"Gr",p:50},  
{id:"M06",en:"Literary",ar:"أدب",icon:"📚",s:"Li",p:30},  
{id:"M07",en:"Linguistics",ar:"لسانيات",icon:"🧠",s:"Ln",p:20},  
{id:"M08",en:"Social",ar:"اجتماعيات",icon:"👥",s:"So",p:15},  
{id:"M09",en:"Techniques",ar:"منهجية",icon:"🎓",s:"Te",p:70},  
{id:"M10",en:"History",ar:"تاريخ",icon:"🏛️",s:"Hi",p:10}  
];  
function render(){  
 document.getElementById('grid').innerHTML=mods.map(m=>`  
 <div class="mod" onclick="handle(this,'${m.id}')">  
  <div class="ico">${m.icon}</div><div class="big">${m.s}</div>  
  <div class="full"><b>${lang==='en'?m.en:m.ar}</b><br><small>${m.id}</small><div class="bar"><div style="width:${m.p}%"></div></div></div>  
 </div>`).join('');  
 document.getElementById('langBtn').innerText=i18n[lang].btn;  
 document.getElementById('t-hint').innerText=i18n[lang].hint;  
 document.getElementById('t-progress').innerText=i18n[lang].prog;  
}  
function handle(el,id){ if(!el.classList.contains('expanded')){document.querySelectorAll('.mod').forEach(x=>x.classList.remove('expanded'));el.classList.add('expanded');}else{let base=window.location.href.substring(0,window.location.href.lastIndexOf('/')+1);window.location.href=base+'lesson.html?id='+id+'&lang='+lang;} }  
function showPage(n){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(n).classList.add('active');}  
function goAdmin(){let base=window.location.href.substring(0,window.location.href.lastIndexOf('/')+1);window.location.href=base+'admin.html';}  
function toggleLang(){lang=lang==='en'?'ar':'en';localStorage.setItem('ufc_lang',lang);render();}  
render();  
</script></body></html>
